services:
  - type: web
    name: urugwiro-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /api/ready/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: urugwiro-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: urugwiro-db
    databaseName: urugwiro
    user: urugwiro
